server:
  port: 8084

spring:
  application:
    name: booking-service
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      uri: mongodb://booking_service_user:password@localhost:27017/booking-service?authSource=booking-service

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://booking_service_user:password@mongodb:27017/booking-service?authSource=booking-service
